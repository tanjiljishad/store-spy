# Integration test harness
#
#   docker compose -f docker-compose.test.yml up -d
#   DATABASE_URL="postgresql://app:app@localhost:5433/ecom_intel_test?options=-c%20search_path%3Dstore_spy%2Cpublic" \
#     npx prisma migrate deploy
#   npm run test:integration
#
# The DATABASE_URL form matters: app tables live in the `store_spy` schema
# (control-plane split), so raw SQL needs it in search_path — but `?schema=`
# would break either the runtime raw SQL or `prisma migrate`. See
# .env.test.example.
#
# Port 5433 deliberately, so this never collides with a local dev Postgres.
# tmpfs storage: the DB is disposable and this makes the suite noticeably faster.

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ecom_intel_test
      # Event headlines contain → and — (see significance.ts / engine.ts). Pin
      # the cluster's encoding explicitly rather than trusting the daemon's
      # default locale — a differently-localed Docker host can otherwise hand
      # you WIN1252/SQL_ASCII and event.createMany() dies on the first arrow.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # The published (host) port below must stay in sync with the DATABASE_URL in
    # .env.test.example (committed) and each dev's local .env.test (gitignored),
    # and with EXPECTED_PORT in vitest.integration.setup.ts. A local .env.test
    # drifted to 5432 once; the preflight in the setup file now fails the run
    # loudly if the live DATABASE_URL doesn't match.
    ports:
      # Loopback only — the integration suite connects via localhost:5433; this
      # disposable DB has no reason to be reachable on any other host interface.
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ecom_intel_test"]
      interval: 2s
      timeout: 3s
      retries: 15
