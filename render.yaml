# Render Blueprint — Milestone 8 Sub-phase B.
#
# Two long-lived process roles against one managed Postgres, per
# docs/milestone-8-subphase-a-production-architecture-research.md Section 27
# ("Option B") and Section 32 (final recommendation): no queue, no Redis, no
# container orchestrator. Render is the primary host recommendation there;
# Fly.io was the equally-valid alternative — this file commits to Render
# concretely, as Sub-phase B's brief requires picking one, not leaving both open.
#
# Postgres itself is NOT defined here — Render's own managed Postgres was not
# chosen (Neon/Supabase were the research's recommendation, for their bundled
# connection pooling, Section 27). Provision the database on Neon (or Supabase)
# directly and paste its connection string into DATABASE_URL below via the
# Render dashboard — never into this file.
#
# DATABASE_URL form: append `?options=-c search_path=store_spy,public`
# (URL-encoded: `?options=-c%20search_path%3Dstore_spy%2Cpublic`) and do NOT
# include `?schema=`. App tables live in the `store_spy` schema since the
# control-plane split; `?schema=` breaks either runtime raw SQL or
# `prisma migrate`. Full rationale in docs/environment-variables.md.
#
# Every envVar below uses `sync: false`, meaning Render stores the real value
# only in its own dashboard/secret store — this file never contains one.
# See docs/environment-variables.md for what each variable protects and how
# to generate it, and docs/staging-deployment.md for the full setup checklist.

services:
  - type: web
    name: store-spy-web
    plan: starter
    region: oregon
    # B4: no build on the host. CI (.github/workflows/ci.yml) builds the image
    # from the Dockerfile and pushes it to GHCR; Render pulls it. Replace
    # OWNER/REPO with the real GitHub path (the repo rename is pending — see
    # docs/staging-deployment.md), and — GHCR packages are private by default —
    # add a registry credential in the Render dashboard (Settings → Registry
    # Credentials). Redeploy on a new `:latest` via Render's image auto-deploy
    # or a CI deploy hook.
    runtime: image
    image:
      url: ghcr.io/tanjiljishad/store-spy:latest
    # No preDeployCommand and no startCommand: the image's ENTRYPOINT runs
    # `prisma migrate deploy` then `node server.js` for the default `web` role,
    # and healthCheckPath below only goes green once that server is answering —
    # so traffic is never routed before migrations are applied. One mechanism,
    # identical to docker-compose.yml. The worker service (CMD override
    # `worker`) never migrates.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      # Not a secret — how many x-forwarded-for entries (from the right) come
      # from proxies actually in front of this service. Render puts exactly
      # one. See docs/environment-variables.md and rate-limit.ts.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SCHEDULER_SECRET
        sync: false
      # Task B / B3 — authenticates GET /api/internal/entitlements
      # (x-internal-secret header). Fails closed (503) if unset. See
      # docs/environment-variables.md.
      - key: CONTROL_PLANE_INTERNAL_SECRET
        sync: false
      # Milestone 12 §1.3 — anonymous analysis's Turnstile challenge. See
      # docs/environment-variables.md: unset locally is fine (the widget
      # just doesn't render), but staging/production need real values from
      # the same Cloudflare Turnstile site.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      # Not a secret — the global anonymous-crawl circuit breaker's ceiling.
      # Defaults to 500 if unset; only set explicitly if a real-traffic
      # value differs.
      - key: ANONYMOUS_CRAWL_HOURLY_CEILING
        value: "500"
      # Milestone 12 §4.1 — signs the HMAC no-login unsubscribe link. See
      # docs/environment-variables.md: fails closed if unset (every
      # unsubscribe link rejected), so this is required for real production
      # marketing email compliance even though nothing crashes without it.
      - key: UNSUBSCRIBE_TOKEN_SECRET
        sync: false
      # Signs the HMAC no-login email-confirmation link (GET /verify-email).
      # See docs/environment-variables.md: fails closed if unset (every
      # confirmation link rejected), so DashboardLayout/AdminLayout's
      # email-verification gate becomes permanently unsatisfiable — required
      # for real production signups.
      - key: EMAIL_VERIFICATION_TOKEN_SECRET
        sync: false
      # Resend API key + From address — see docs/environment-variables.md.
      # Both required together or nothing sends; signup/resend-verification
      # degrade to "no email sent" rather than crashing without them, but
      # the email-verification gate then has no way to ever pass.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Milestone 12 §4.2 Step 2 — the Meta base Pixel. Not a secret (a
      # Pixel ID is public by design), but still sync: false since it's a
      # real per-environment value, not a build-time constant. Leave both
      # unset to keep the pixel off in a given environment — see
      # docs/environment-variables.md.
      - key: NEXT_PUBLIC_META_PIXEL_ENABLED
        sync: false
      - key: NEXT_PUBLIC_META_PIXEL_ID
        sync: false
      # Milestone 12 §4.2 Step 2, vendor 2 — GA4's client base tag. Same
      # public/non-secret status as the Meta pixel ID above. Leave both
      # unset to keep the tag off in a given environment.
      - key: NEXT_PUBLIC_GA4_MEASUREMENT_ENABLED
        sync: false
      - key: NEXT_PUBLIC_GA4_MEASUREMENT_ID
        sync: false
      # Milestone 12 §4.2 Step 2, vendor 3 — TikTok's client base pixel. Same
      # public/non-secret status as the other two vendors' pixel ids above.
      - key: NEXT_PUBLIC_TIKTOK_PIXEL_ENABLED
        sync: false
      - key: NEXT_PUBLIC_TIKTOK_PIXEL_ID
        sync: false
      # Milestone 12 §4.2 Step 2, vendor 4 — LinkedIn's client base Insight
      # Tag. Same public/non-secret status as the other vendors' pixel ids.
      - key: NEXT_PUBLIC_LINKEDIN_PIXEL_ENABLED
        sync: false
      - key: NEXT_PUBLIC_LINKEDIN_PARTNER_ID
        sync: false

  - type: worker
    name: store-spy-worker
    plan: starter
    region: oregon
    # Same image as the web service (keep the tag in lockstep). `dockerCommand`
    # overrides the image's default CMD (`web`) so the ENTRYPOINT runs the
    # `worker` role — the scheduler cycle, which NEVER runs migrations.
    runtime: image
    image:
      url: ghcr.io/OWNER/REPO:latest
    dockerCommand: worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      # AUTH_SECRET/AUTH_TRUST_HOST intentionally omitted — verified this
      # sub-phase (Milestone 8 Sub-phase C) that the worker's own import
      # chain never touches next-auth/@auth/core (it only calls the
      # scheduler functions and Prisma directly), and a real local worker
      # run with AUTH_SECRET unset completed a full cycle with no error.
      # SCHEDULER_SECRET is also intentionally omitted — the worker calls
      # runSchedulerTick()/runMarketingSchedulerTick() directly, in-process,
      # never through the HTTP-authenticated /api/internal/scheduler/* routes
      # (see scripts/worker.ts's own header comment and
      # docs/environment-variables.md). It needs neither.
      # Milestone 12 §4.2 Step 2 — the ONE process that would ever call
      # Meta's Conversions API (dispatchPendingConversionEvents(), never
      # the web request path). Deliberately left UNSET: Milestone 12 §4.3
      # (the credential vault) hasn't shipped, so there's no safe place to
      # actually configure this secret yet — see this variable's own doc
      # comment in environment-variables.md. Declared here, empty, so this
      # is the one place it'll go once §4.3 exists; setting a real value
      # today would just make every dispatch attempt fail loudly instead
      # of skipping gracefully (see dispatchMetaConversionEvent()'s own
      # PROVIDER SEAM comment), with no actual event ever reaching Meta.
      - key: META_CONVERSIONS_API_ACCESS_TOKEN
        sync: false
      # Milestone 12 §4.2 Step 2, vendor 2 — same deliberately-unset status
      # as META_CONVERSIONS_API_ACCESS_TOKEN above, and the same reason:
      # §4.3 (the credential vault) hasn't shipped, so dispatchGoogleConversion
      # Event() marks every event SKIPPED_NO_CREDENTIAL until it does.
      - key: GOOGLE_MEASUREMENT_PROTOCOL_API_SECRET
        sync: false
      # Milestone 12 §4.2 Step 2, vendor 3 — same deliberately-unset status
      # as the other two vendors' server-side secrets above, same reason:
      # §4.3 (the credential vault) hasn't shipped.
      - key: TIKTOK_EVENTS_API_ACCESS_TOKEN
        sync: false
      # Milestone 12 §4.2 Step 2, vendor 4 — same deliberately-unset status
      # as the other vendors' server-side secrets above, same reason: §4.3
      # (the credential vault) hasn't shipped.
      - key: LINKEDIN_CONVERSIONS_API_ACCESS_TOKEN
        sync: false
      # Milestone 12 §4.2 Step 2, vendor 5 — X's Conversions API. UNLIKE
      # every other vendor, X has no client-side pixel yet (pending an
      # operator decision — see src/lib/marketing/pixels/x.ts), so
      # X_PIXEL_ID lives only here on the worker, not on the web service.
      - key: X_PIXEL_ID
        sync: false
      - key: X_CONVERSIONS_API_ACCESS_TOKEN
        sync: false
